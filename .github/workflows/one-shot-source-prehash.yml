name: One-shot source pre-hash implementation

on:
  push:
    paths:
      - tools/one_shot_source_prehash.py
      - tools/source_prehash_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source pre-hash implementation
        run: python tools/one_shot_source_prehash.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md tests
          git commit -m "Add optional source SHA-256 pre-hash"
          git push

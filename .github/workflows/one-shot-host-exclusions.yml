name: One-shot host exclusion paths

on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_host_exclusions.py
      - .github/workflows/one-shot-host-exclusions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply host exclusion implementation
        run: python tools/one_shot_host_exclusions.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Run focused path/settings tests
        run: python -m unittest tests.test_admin tests.test_path_display -v
      - name: Validate settings JavaScript
        run: node --check app/static/settings-extras-ui.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin.py app/main.py app/static/settings-extras-ui.js tests/test_admin.py
          git diff --cached --quiet && exit 0
          git commit -m "Accept TrueNAS paths in exclusion settings"
          git push

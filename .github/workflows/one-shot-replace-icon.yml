name: One-shot replace app icon

on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_replace_icon.py
      - .github/workflows/one-shot-replace-icon.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate valid PNG icon files
        run: python tools/one_shot_replace_icon.py
      - name: Validate PNG structure and dimensions
        run: |
          python - <<'PY'
          import struct, zlib
          from pathlib import Path

          def validate(path: Path):
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{path}: bad PNG signature'
              pos = 8
              width = height = None
              idat = bytearray()
              saw_iend = False
              while pos < len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  payload = data[pos+8:pos+8+length]
                  stored = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
                  actual = zlib.crc32(kind)
                  actual = zlib.crc32(payload, actual) & 0xffffffff
                  assert stored == actual, f'{path}: bad CRC in {kind!r}'
                  if kind == b'IHDR':
                      width, height = struct.unpack('>II', payload[:8])
                  elif kind == b'IDAT':
                      idat.extend(payload)
                  elif kind == b'IEND':
                      saw_iend = True
                      break
                  pos += 12 + length
              assert (width, height) == (1024, 1024), f'{path}: unexpected size {width}x{height}'
              assert idat and saw_iend, f'{path}: incomplete PNG'
              zlib.decompress(bytes(idat))
              return data

          a = validate(Path('assets/icon.png'))
          b = validate(Path('app/static/icon.png'))
          assert a == b, 'repository icon copies differ'
          print('Both icon files are valid, identical 1024x1024 PNGs.')
          PY
      - name: Commit replacement icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png app/static/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Replace corrupted app icon with valid PNG"
          git push

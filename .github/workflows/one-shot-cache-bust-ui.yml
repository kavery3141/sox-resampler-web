name: One-shot UI cache bust
on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_cache_bust_ui.py
      - .github/workflows/one-shot-cache-bust-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/one_shot_cache_bust_ui.py
      - run: node --check app/static/ui.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/index.html app/static/ui.js
          git diff --cached --quiet && exit 0
          git commit -m "Cache-bust UI add-ons after dev deploys"
          git push

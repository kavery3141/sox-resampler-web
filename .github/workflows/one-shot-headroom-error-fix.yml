name: One-shot headroom retry error handling
on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_headroom_error_fix.py
      - .github/workflows/one-shot-headroom-error-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/one_shot_headroom_error_fix.py
      - run: node --check app/static/retry-headroom.js
      - run: python -m py_compile app/main.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/retry-headroom.js app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Improve headroom retry failure diagnostics"
          git push

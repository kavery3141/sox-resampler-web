name: One-shot favicon wiring
on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_favicon.py
      - .github/workflows/one-shot-favicon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/one_shot_favicon.py
      - run: |
          grep -Fq 'rel="icon" type="image/x-icon" href="/static/favicon.ico?v=20260902b"' app/static/index.html
          grep -Fq '<img src="/static/icon.png?v=20260902b" alt="SoX Resampler Web">' app/static/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use favicon.ico in Web UI"
          git push

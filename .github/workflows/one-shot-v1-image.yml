name: One-shot v1.0.0 image

on:
  push:
    paths:
      - .github/workflows/one-shot-v1-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.0.0
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
      - name: Set up Node.js for UI syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Web UI JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find app/static -maxdepth 1 -type f -name '*.js' | sort)
      - name: Validate app icon PNGs
        run: python tools/validate_icons.py
      - name: Validate TrueNAS Custom App YAML
        run: docker compose -f compose.truenas.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push v1.0.0
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=1.0.0
            BUILD_SHA=e4782ecb11264a2a444e03fce6be9f9831b43b95
          tags: |
            ghcr.io/kavery3141/sox-resampler-web:1.0.0
            ghcr.io/kavery3141/sox-resampler-web:v1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

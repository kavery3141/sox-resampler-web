name: One-shot APPLICATION metadata preservation

on:
  push:
    paths:
      - tools/patch_application_metadata.py
      - .github/workflows/one-shot-application-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Apply targeted patch
        run: python tools/patch_application_metadata.py
      - name: Validate Python syntax
        run: python -m py_compile app/converter.py tests/test_application_metadata.py
      - name: Run APPLICATION metadata tests
        run: pytest -q tests/test_application_metadata.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/converter.py tests/test_application_metadata.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Preserve FLAC APPLICATION metadata blocks'
            git push
          fi

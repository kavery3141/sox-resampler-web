name: One-shot source snapshot implementation

on:
  push:
    paths:
      - tools/one_shot_source_snapshot.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source snapshot implementation
        run: python tools/one_shot_source_snapshot.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md tests
          git commit -m "Persist and revalidate source identity snapshots"
          git push

name: One-shot host path presentation

on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_host_paths.py
      - .github/workflows/one-shot-host-paths.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply host path presentation implementation
        run: python tools/one_shot_host_paths.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Validate Web UI JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/ui.js
          node --check app/static/issues-ui.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/issues.py app/reports.py app/static/ui.js app/static/issues-ui.js compose.truenas.yaml README.md tests/test_path_display.py
          git diff --cached --quiet && exit 0
          git commit -m "Present TrueNAS host paths in UI and reports"
          git push

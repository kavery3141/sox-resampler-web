name: One-shot CPU resource control

on:
  push:
    paths:
      - tools/one_shot_cpu_resource_control.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CPU resource control patch
        run: python tools/one_shot_cpu_resource_control.py
      - name: Commit patched application
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/converter.py tests/test_cpu_limit.py tests/test_converter_integration.py
          git commit -m "Harden CPU cap process lifecycle"
          git push

name: One-shot ownership preservation preflight

on:
  push:
    paths:
      - tools/one_shot_ownership_preflight.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ownership preservation preflight
        run: python tools/one_shot_ownership_preflight.py
      - name: Commit patched application
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/converter.py app/admin.py README.md tests/test_filesystem_preservation.py
          git commit -m "Preflight filesystem ownership preservation"
          git push

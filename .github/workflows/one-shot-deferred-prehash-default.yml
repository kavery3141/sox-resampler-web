name: One-shot deferred prehash default

on:
  push:
    paths:
      - tools/one_shot_deferred_prehash_default.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python tools/one_shot_deferred_prehash_default.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/jobs.py
          git commit -m "Default deferred retry source pre-hash off"
          git push

name: One-shot update checker wiring

on:
  push:
    paths:
      - tools/one_shot_update_ui_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire update checker
        run: python tools/one_shot_update_ui_patch.py
      - name: Commit patched application
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/ui.js
          git commit -m "Wire read-only update availability checker"
          git push

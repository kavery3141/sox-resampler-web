name: One-shot TrueNAS mode preservation fix
on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_truenas_mode_fix.py
      - .github/workflows/one-shot-truenas-mode-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/one_shot_truenas_mode_fix.py
      - run: python -m unittest tests.test_filesystem_preservation -v
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/converter.py tests/test_filesystem_preservation.py
          git diff --cached --quiet && exit 0
          git commit -m "Handle inherited TrueNAS ACL mode safely"
          git push

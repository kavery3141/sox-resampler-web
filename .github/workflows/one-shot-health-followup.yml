name: One-shot health hardening

on:
  push:
    paths:
      - tools/one_shot_health_followup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply health hardening
        run: python tools/one_shot_health_followup.py
      - name: Commit patched application
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/admin.py
          git commit -m "Harden health database checks and backend versions"
          git push

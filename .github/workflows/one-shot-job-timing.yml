name: One-shot job timing split

on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_job_timing.py
      - .github/workflows/one-shot-job-timing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply job timing implementation
        run: python tools/one_shot_job_timing.py
      - name: Validate Python syntax
        run: python -m compileall -q app tests
      - name: Run focused timing tests
        run: python -m unittest tests.test_admin tests.test_reports -v
      - name: Validate live stats JavaScript
        run: node --check app/static/live-stats.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin.py app/reports.py app/static/live-stats.js tests/test_admin.py tests/test_reports.py
          git diff --cached --quiet && exit 0
          git commit -m "Split paused interrupted and idle job timing"
          git push

name: One-shot three-worker support

on:
  push:
    paths:
      - tools/patch_workers3.py
      - .github/workflows/one-shot-workers3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        run: python tools/patch_workers3.py
      - name: Validate Python syntax
        run: python -m py_compile app/main.py app/review.py app/jobs.py
      - name: Validate JavaScript syntax
        run: |
          node --check app/static/retry-failed.js
          node --check app/static/retry-headroom.js
      - name: Validate worker options
        run: |
          grep -q 'option value="3">3 — Maximum' app/static/index.html
          grep -q 'option value="3">3 — Maximum' app/static/retry-failed.js
          grep -q 'option value="3">3 — Maximum' app/static/retry-headroom.js
          grep -q 'min(3, current_workers)' app/jobs.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/static/index.html app/static/retry-failed.js app/static/retry-headroom.js app/main.py app/review.py app/jobs.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Allow three concurrent conversions'
            git push
          fi

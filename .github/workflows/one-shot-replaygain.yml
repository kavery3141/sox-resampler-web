name: One-shot ReplayGain integration
on:
  push:
    branches: [main]
    paths:
      - tools/one_shot_replaygain.py
      - .github/workflows/one-shot-replaygain.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/one_shot_replaygain.py
      - run: python -m py_compile app/replaygain.py app/jobs.py app/main.py app/health_status.py tests/test_replaygain.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/jobs.py app/main.py app/health_status.py Dockerfile
          git diff --cached --quiet && exit 0
          git commit -m "Recalculate ReplayGain with true peak after conversion"
          git push

services:
  sox-resampler-web:
    image: ghcr.io/kavery3141/sox-resampler-web:1.0.0
    pull_policy: always
    container_name: sox-resampler-web
    restart: unless-stopped
    user: "568:568"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "30058:8080"
    environment:
      TZ: America/Indiana/Indianapolis
      MUSIC_ROOT: /music
      HOST_MUSIC_ROOT: /mnt/MainStorage/StorageDataset/Music
      DATA_ROOT: /data
      ZFS_POOL: MainStorage
      DEFAULT_TARGET_RATE: "48000"
      DEFAULT_FLAC_COMPRESSION: "4"
      DEFAULT_WORKERS: "1"
      MAX_WORKERS: "3"
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - /mnt/MainStorage/StorageDataset/Music:/music:rw
      - /mnt/MainStorage/StorageDataset/sox-resampler:/data:rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 90s
